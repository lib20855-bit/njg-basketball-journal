<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LEE'S EVOLVE HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050608;
  --surface: rgba(22, 25, 32, 0.7);
  --surface-active: rgba(30, 35, 45, 0.9);
  --border: rgba(255, 255, 255, 0.08);
  --green: #00ff88;
  --purple: #9d7fff;
  --orange: #ff6b35;
  --blue: #38bdf8;
  --text: #ffffff;
  --text-dim: rgba(255, 255, 255, 0.6);
  --radius: 20px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* 🔥 HERO: 人格化入口 (靖哥, 这里的 URL 换成你最帅的那张照片) */
.hero {
  height: 55vh;
  background: url('https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=1000') center/cover no-repeat;
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 30px 24px;
}
.hero::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 0%, rgba(5, 6, 8, 0.4) 60%, var(--bg) 100%);
}
.hero-content { position: relative; z-index: 10; }
.hero-name { font-family: 'Bebas Neue'; font-size: 4rem; line-height: 0.9; letter-spacing: 2px; text-shadow: 0 10px 20px rgba(0,0,0,0.4); }
.hero-tag { font-size: 11px; font-weight: 700; color: var(--green); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }

/* 动态数据行 */
.stat-bar { 
  display: flex; gap: 10px; margin-top: 20px; position: relative; z-index: 10; 
}
.stat-pill { 
  flex: 1; background: var(--surface); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center;
}
.stat-n { font-family: 'Bebas Neue'; font-size: 1.4rem; color: #fff; display: block; }
.stat-l { font-size: 9px; color: var(--text-dim); text-transform: uppercase; }

/* 🔥 模块网络: 视觉锚点设计 */
.module-grid { 
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 24px; 
}
.module-card {
  height: 160px; border-radius: var(--radius); border: 1px solid var(--border);
  position: relative; overflow: hidden; display: flex; flex-direction: column; 
  justify-content: flex-end; padding: 18px; transition: transform 0.2s;
  background-size: cover; background-position: center;
}
.module-card:active { transform: scale(0.96); }
.module-card::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(225deg, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
}
.mc-inner { position: relative; z-index: 2; }
.mc-label { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
.mc-name { font-family: 'Bebas Neue'; font-size: 1.8rem; letter-spacing: 1px; color: #fff; line-height: 1; }

/* 底部操作 */
.fab {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  height: 64px; width: 64px; border-radius: 50%; background: #fff; color: #000;
  display: flex; align-items: center; justify-content: center; font-size: 32px;
  box-shadow: 0 15px 35px rgba(255, 255, 255, 0.2); border: none; z-index: 100;
}
</style>
</head>
<body>

<div id="home-view">
  <div class="hero">
    <div class="hero-content">
      <div class="hero-tag">2026.SEASON_READY</div>
      <div class="hero-name">LEE / THE<br>EVOLVER</div>
    </div>
    <div class="stat-bar">
      <div class="stat-pill"><span class="stat-n" id="stat-player">0</span><span class="stat-l">Player</span></div>
      <div class="stat-pill"><span class="stat-n" id="stat-coach">0</span><span class="stat-l">Coach</span></div>
      <div class="stat-pill"><span class="stat-n" id="stat-ref">0</span><span class="stat-l">Ref</span></div>
      <div class="stat-pill" style="border-color: var(--blue);"><span class="stat-n" id="stat-fit">0</span><span class="stat-l" style="color: var(--blue);">PR_Record</span></div>
    </div>
  </div>

  <div class="module-grid">
    <div class="module-card" style="background-image:url('https://images.unsplash.com/photo-1519861531473-9200362349c4?q=80&w=500')" onclick="enter('player')">
      <div class="mc-inner"><div class="mc-label" style="color:var(--green)">Evolution</div><div class="mc-name">PLAYER</div></div>
    </div>
    <div class="module-card" style="background-image:url('https://images.unsplash.com/photo-1508615070457-7baeba4003ab?q=80&w=500')" onclick="enter('coach')">
      <div class="mc-inner"><div class="mc-label" style="color:var(--purple)">Strategy</div><div class="mc-name">COACH</div></div>
    </div>
    <div class="module-card" style="background-image:url('https://images.unsplash.com/photo-1541534741688-6078c64b5913?q=80&w=500')" onclick="enter('ref')">
      <div class="mc-inner"><div class="mc-label" style="color:var(--orange)">Decision</div><div class="mc-name">REFEREE</div></div>
    </div>
    <div class="module-card" style="background-image:url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=500')" onclick="enter('fit')">
      <div class="mc-inner"><div class="mc-label" style="color:var(--blue)">Metrics</div><div class="mc-name">FITNESS</div></div>
    </div>
  </div>
</div>

<button class="fab" onclick="alert('Quick Entry')">+</button>

<script>
  // 靖哥，这里接你原本的存储和 updateStats 逻辑
  function updateHomeStats() {
    const store = JSON.parse(localStorage.getItem('bball_v4') || '{}');
    ['player','coach','ref','fit'].forEach(m => {
      const el = document.getElementById(`stat-${m}`);
      if(el) el.textContent = (store[m] || []).length;
    });
  }
  updateHomeStats();
</script>
</body>
</html>
